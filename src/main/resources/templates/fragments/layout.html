<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Mercado Express'">Mercado Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark mx-navbar mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">🛒 Mercado <span>Express</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/mercado}">Produtos</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/mercado/novo}">+ Novo produto</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin}">Painel admin</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2">
                <span class="text-light small" sec:authorize="isAuthenticated()">
                    <span sec:authentication="name">usuario</span>
                    <span class="badge badge-role-admin ms-1" sec:authorize="hasRole('ADMIN')">ADMIN</span>
                    <span class="badge bg-light text-success ms-1" sec:authorize="hasRole('CLIENTE')">CLIENTE</span>
                </span>
                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline m-0">
                    <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
                </form>
                <a sec:authorize="isAnonymous()" class="btn btn-outline-light btn-sm" th:href="@{/login}">Entrar</a>
                <a sec:authorize="isAnonymous()" class="btn btn-mx-laranja btn-sm" th:href="@{/cadastro}">Criar conta</a>
            </div>
        </div>
    </div>
</nav>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
