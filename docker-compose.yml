# PostgreSQL local para desenvolvimento:  docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: mercado-express-postgres
    environment:
      POSTGRES_DB: mercado_express
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
